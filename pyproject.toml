[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["FA100"]
fixable = ["I", "F401"]

[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv10"
